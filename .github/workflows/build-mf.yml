name: PonWrt Nokia XG-040G-MF NPU Firmware

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "Parallel compile jobs (2 is safest for memory)"
        required: true
        type: choice
        options: ["2", "3", "4"]
        default: "2"
  push:
    paths:
      - ".github/workflows/build-mf.yml"
      - "feeds.conf.add"
      - "config.seed"
      - "scripts/**"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: nokia-xg040gmf-ponwrt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout build overlay
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint \
            binutils bison build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm \
            lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf \
            python3 python3-pip python3-ply python3-docutils python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: Clone PonWrt and select Nokia profile
        run: |
          git clone --depth=1 https://github.com/pbs05/ponwrt.git openwrt
          cd openwrt
          cp configs/an7583.config .config
          # Enable AN7583 NPU only on the Nokia MF UBI device tree.
          DTS=target/linux/airoha/dts/an7583-nokia_xg-040g-mf-ubi.dts
          IMAGE_MK=target/linux/airoha/image/an7583.mk
          test -f "$DTS"
          grep -qx 'CONFIG_NET_AIROHA_NPU=y' target/linux/airoha/an7583/config-6.18
          grep -q 'compatible = "airoha,an7583-npu"' target/linux/airoha/dts/an7583.dtsi
          grep -q 'Package/airoha-an7583-npu-firmware' package/firmware/linux-firmware/airoha.mk
          # Add the NPU firmware at the Nokia MF common device definition.
          # The upstream DEVICE_PACKAGES assignment is continued across several lines,
          # so do not rely on matching its first physical line.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("target/linux/airoha/image/an7583.mk")
          lines = p.read_text().splitlines(keepends=True)
          start = next((i for i, line in enumerate(lines)
                        if line.startswith("define Device/nokia_xg-040g-mf-common")), None)
          if start is None:
              raise SystemExit("Nokia MF common device definition not found")
          end = next((i for i in range(start + 1, len(lines))
                      if lines[i].strip() == "endef"), None)
          if end is None:
              raise SystemExit("Nokia MF common device definition end not found")
          block = "".join(lines[start:end])
          if "airoha-an7583-npu-firmware" not in block:
              lines.insert(end, "\\tDEVICE_PACKAGES += airoha-an7583-npu-firmware\\n")
              p.write_text("".join(lines))
          PY
          PY
          # The base AN7583 DTS disables NPU by default; enable it for MF UBI only.
          if ! grep -q '&npu' "$DTS"; then
            cat >> "$DTS" <<'EOF'

          /* Enable AN7583 hardware NPU on Nokia XG-040G-MF UBI. */
          &npu {
            status = "okay";
          };
          EOF
          fi
          grep -q 'airoha-an7583-npu-firmware' "$IMAGE_MK"
          grep -q '&npu' "$DTS"
          # Build only the Nokia MF UBI profile; never emit the stock-layout image.
          sed -i 's/^CONFIG_TARGET_DEVICE_airoha_an7583_DEVICE_nokia_xg-040g-mf=y/# CONFIG_TARGET_DEVICE_airoha_an7583_DEVICE_nokia_xg-040g-mf is not set/' .config
          cat "$GITHUB_WORKSPACE/feeds.conf.add" >> feeds.conf.default
          grep -q 'Device/nokia_xg-040g-mf-ubi' target/linux/airoha/image/an7583.mk
          grep -q '^CONFIG_TARGET_airoha_an7583=y$' .config
          grep -q '^CONFIG_TARGET_DEVICE_airoha_an7583_DEVICE_nokia_xg-040g-mf-ubi=y$' .config
          mkdir -p "$GITHUB_WORKSPACE/output"
          {
            echo "Source: https://github.com/pbs05/ponwrt"
            echo "Base: ImmortalWrt"
            echo "Target: airoha/an7583"
            echo "Profile: nokia_xg-040g-mf-ubi"
            echo "PonWrt upstream config: configs/an7583.config"
            echo "Nokia profile is enabled in upstream AN7583 multi-profile config."
          } > "$GITHUB_WORKSPACE/output/source-profile-audit.txt"

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add optional router packages
        working-directory: openwrt
        run: |
          # Keep the PonWrt upstream AN7583 profile and request the selected extras.
          {
            echo 'CONFIG_PACKAGE_luci=y'
            echo 'CONFIG_PACKAGE_luci-compat=y'
            echo 'CONFIG_PACKAGE_luci-i18n-base-zh-cn=y'
            for pkg in \
              luci-app-openclash luci-app-passwall2 luci-app-nlbwmon \
              luci-app-statistics luci-app-ttyd luci-app-wol luci-app-ddns \
              ddns-scripts htop qmodem luci-app-qmodem-next \
              kmod-usb-net kmod-usb-net-cdc-ether kmod-usb-net-cdc-ncm \
              kmod-usb-net-qmi-wwan kmod-usb-net-cdc-mbim kmod-usb-net-rndis \
              kmod-usb-serial kmod-usb-serial-option kmod-usb-serial-wwan \
              usb-modeswitch uqmi umbim comgt comgt-ncm \
              luci-proto-qmi luci-proto-mbim luci-proto-ncm \
              kmod-mac80211 kmod-cfg80211 iw iwinfo; do
              echo "CONFIG_PACKAGE_${pkg}=y"
            done
          } >> .config
          make defconfig
          grep -qx 'CONFIG_TARGET_DEVICE_airoha_an7583_DEVICE_nokia_xg-040g-mf-ubi=y' .config
          grep -qx 'CONFIG_NET_AIROHA_NPU=y' target/linux/airoha/an7583/config-6.18
          grep -q 'airoha-an7583-npu-firmware' target/linux/airoha/image/an7583.mk
          {
            echo "NPU audit:"
            echo "Kernel: CONFIG_NET_AIROHA_NPU=y"
            echo "DTS: Nokia XG-040G-MF UBI enables &npu"
            echo "Firmware: airoha-an7583-npu-firmware included in device packages"
          } > "$GITHUB_WORKSPACE/output/npu-support-audit.txt"
          {
            echo "Optional package resolution:"
            for pkg in \
              luci-app-openclash luci-app-passwall2 luci-app-nlbwmon \
              luci-app-statistics luci-app-ttyd luci-app-wol luci-app-ddns \
              qmodem luci-app-qmodem-next kmod-usb-net-qmi-wwan \
              kmod-usb-net-cdc-mbim luci-proto-qmi luci-proto-mbim; do
              if grep -qx "CONFIG_PACKAGE_${pkg}=y" .config; then
                echo "ENABLED ${pkg}"
              else
                echo "UNAVAILABLE_OR_DEPENDENCY_MISSING ${pkg}"
              fi
            done
          } > "$GITHUB_WORKSPACE/output/package-availability.txt"

      - name: Add Airoha NPU LuCI management interface
        working-directory: openwrt
        run: |
          # Dashboard supports AN7581 and AN7583 NPU/engine telemetry.
          git clone --depth=1 https://github.com/rchen14b/luci-app-airoha-npu.git package/luci-app-airoha-npu
          test -f package/luci-app-airoha-npu/Makefile
          {
            echo 'CONFIG_PACKAGE_luci-app-airoha-npu=y'
          } >> .config
          make defconfig
          grep -qx 'CONFIG_TARGET_DEVICE_airoha_an7583_DEVICE_nokia_xg-040g-mf-ubi=y' .config
          {
            if grep -qx 'CONFIG_PACKAGE_luci-app-airoha-npu=y' .config; then
              echo 'NPU LuCI dashboard: ENABLED'
            else
              echo 'NPU LuCI dashboard: NOT_SELECTED_BY_KCONFIG'
            fi
          } > "$GITHUB_WORKSPACE/output/npu-ui-audit.txt"

      - name: Add CPU management LuCI applications (pinned sources)
        working-directory: openwrt
        run: |
          git clone https://github.com/openwrt-xiaomi/luci-app-cpufreq.git package/luci-app-cpufreq
          git -C package/luci-app-cpufreq checkout 7910f1ff8d964d8bc168d9559034adbbac5b3729

          # AN7583 uses its own NPU target; keep the generic cpufreq UI only.
          {
            echo 'CONFIG_PACKAGE_luci-app-cpufreq=y'
            echo ''
          } >> .config
          make defconfig
          # The target profile is mandatory. Optional LuCI apps may be dropped by
          # PonWrt Kconfig when a dependency is unavailable; report rather than abort.
          grep -qx 'CONFIG_TARGET_DEVICE_airoha_an7583_DEVICE_nokia_xg-040g-mf-ubi=y' .config
          {
            echo "CPU package resolution after defconfig:"
            for pkg in luci-app-cpufreq; do
              if grep -qx "CONFIG_PACKAGE_${pkg}=y" .config; then
                echo "ENABLED ${pkg}"
              else
                echo "NOT_SELECTED_BY_KCONFIG ${pkg}"
              fi
            done
          } > "$GITHUB_WORKSPACE/output/cpu-package-availability.txt"

          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-cpufreq-schedutil <<'EOF'
          #!/bin/sh
          # Prefer schedutil when supported; do not pin CPU frequency.
          p=/sys/devices/system/cpu/cpufreq/policy0
          [ -w "$p/scaling_governor" ] || exit 0
          avail="$(cat "$p/scaling_available_governors" 2>/dev/null)"
          case " $avail " in
            *" schedutil "*) echo schedutil > "$p/scaling_governor" ;;
            *) logger -t cpufreq-default "schedutil unavailable; keep kernel default" ;;
          esac
          exit 0
          EOF
          chmod 0755 files/etc/uci-defaults/99-cpufreq-schedutil
          {
            echo "CPU apps:"
            grep '^CONFIG_PACKAGE_luci-app-' .config | grep -E 'cpufreq' || true
          } > "$GITHUB_WORKSPACE/output/cpu-management-audit.txt"
          cp .config "$GITHUB_WORKSPACE/output/build.config.resolved"

      - name: Download sources
        working-directory: openwrt
        run: make download -j8

      - name: Compile PonWrt firmware
        working-directory: openwrt
        env:
          BUILD_JOBS: ${{ inputs.jobs || '2' }}
        run: make -j"${BUILD_JOBS}" V=s

      - name: Collect Nokia XG-040G-MF UBI images and reports
        if: success()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output"
          find openwrt/bin/targets/airoha/an7583 -maxdepth 1 -type f \
            \( -iname '*nokia_xg-040g-mf-ubi*' -o -iname '*nokia_xg-040g-mf*manifest' \) \
            -exec cp -v {} "$GITHUB_WORKSPACE/output/" \;
          # Mark the distributed firmware image filenames as NPU-enabled.
          for image in "$GITHUB_WORKSPACE"/output/*.itb; do
            [ -f "$image" ] || continue
            base="${image%.itb}"
            case "$base" in *-NPU) ;; *) mv "$image" "${base}-NPU.itb" ;; esac
          done
          cp openwrt/.config "$GITHUB_WORKSPACE/output/build.config"
          cp openwrt/feeds.conf.default "$GITHUB_WORKSPACE/output/feeds.conf.default"
          test -n "$(find "$GITHUB_WORKSPACE/output" -maxdepth 1 -type f -iname '*nokia_xg-040g-mf-ubi*NPU*.itb' -print -quit)"

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-nokia-xg040gmf-ubi-npu-firmware
          path: output/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-nokia-xg040gmf-npu-build-diagnostics
          path: |
            openwrt/.config
            openwrt/logs/**
          if-no-files-found: ignore
          retention-days: 7
