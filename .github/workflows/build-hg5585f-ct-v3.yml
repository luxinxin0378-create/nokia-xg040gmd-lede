name: PonWrt V3 - FiberHome HG5585F CT

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-hg5585f-ct-v3.yml"
      - "README-HG5585F-CT.md"

permissions:
  contents: read

env:
  SOURCE_REPO: https://github.com/pbs05/ponwrt.git
  SOURCE_BRANCH: master
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout build recipe
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ack asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler flex \
            gawk gettext gcc-multilib g++-multilib git gperf libelf-dev libncurses-dev \
            libssl-dev python3-dev python3-pip python3-setuptools python3-ply rsync \
            scons squashfs-tools swig unzip wget zlib1g-dev zstd file

      - name: Clone PonWrt V3 source
        run: |
          git clone --depth 1 --branch "$SOURCE_BRANCH" "$SOURCE_REPO" ponwrt
          cd ponwrt
          echo "PONWRT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          grep -q 'TARGET_DEVICES += fiberhome_hg5585f-ct' target/linux/airoha/image/an7581.mk

      - name: Update feeds
        working-directory: ponwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure HG5585F CT
        working-directory: ponwrt
        run: |
          cp configs/an7581.config .config
          echo 'CONFIG_TARGET_airoha_an7581_DEVICE_fiberhome_hg5585f-ct=y' >> .config
          make defconfig
          grep -E '^CONFIG_TARGET_airoha_an7581_DEVICE_fiberhome_hg5585f-ct=y$' .config
          grep -q '^CONFIG_TARGET_airoha_an7581_DEVICE_fiberhome_hg5585f-ct=y$' .config
          grep -q 'fiberhome_hg5585f-ct' target/linux/airoha/image/an7581.mk
          cp .config hg5585f-ct.config
          {
            echo "PonWrt commit: $PONWRT_COMMIT"
            echo "Target: Airoha AN7581 / FiberHome HG5585F CT"
            echo "Profile: fiberhome_hg5585f-ct"
          } > build-info.txt

      - name: Download package sources
        working-directory: ponwrt
        run: make download -j8

      - name: Compile HG5585F CT firmware
        working-directory: ponwrt
        run: |
          make -j"$(nproc)" || make -j1 V=s

      - name: Upload HG5585F CT firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PonWrt-V3-HG5585F-CT-${{ github.run_number }}
          path: |
            ponwrt/bin/targets/airoha/an7581/
            ponwrt/hg5585f-ct.config
            ponwrt/build-info.txt
          if-no-files-found: warn
          retention-days: 14
