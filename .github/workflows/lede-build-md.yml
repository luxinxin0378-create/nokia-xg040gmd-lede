name: LEDE Nokia XG-040G-MD NPU Firmware

on:
  push:
    paths:
      - ".github/workflows/lede-build-md.yml"
      - "lede-config.seed"
      - "lede-feeds.conf"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Nokia XG-040G-MD UBI NPU firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint \
            binutils bison build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm \
            lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf \
            python3 python3-pip python3-ply python3-docutils python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: Clone source and enable AN7581 NPU for MD
        run: |
          git clone --depth=1 https://github.com/coolsnowwolf/lede.git openwrt
          cd openwrt
          cp "$GITHUB_WORKSPACE/lede-config.seed" .config
          cat "$GITHUB_WORKSPACE/lede-feeds.conf" >> feeds.conf.default
          # luci-theme-design is already provided by the upstream Lean luci feed.
          # Avoid the unavailable external design feed that caused feed update to fail.
          grep -q 'Device/nokia_xg-040g-md-ubi' target/linux/airoha/image/an7581.mk
          MD_DTS=target/linux/airoha/dts/an7581-nokia_xg-040g-md-ubi.dts
          test -f "$MD_DTS"
          grep -q 'CONFIG_NET_AIROHA_NPU=y' target/linux/airoha/an7581/config-6.18
          cat >> "$MD_DTS" <<'EOF'

          /* Enable EN7581 hardware NPU on Nokia XG-040G-MD UBI. */
          &npu {
            status = "okay";
          };
          EOF
          # Put the matching EN7581 NPU firmware in this Nokia device image.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("target/linux/airoha/image/an7581.mk")
          lines = p.read_text().splitlines(keepends=True)
          if not any("airoha-en7581-npu-firmware" in line for line in lines):
              start = next((i for i, line in enumerate(lines)
                            if line.startswith("define Device/nokia_xg-040g-md-common")), None)
              if start is None:
                  raise SystemExit("Nokia MD common device profile not found")
              end = next((i for i in range(start + 1, len(lines))
                          if lines[i].strip() == "endef"), None)
              if end is None:
                  raise SystemExit("Nokia MD common device profile end not found")
              for i in range(start + 1, end):
                  if "luci-app-pon" in lines[i]:
                      lines[i] = lines[i].rstrip(chr(10)) + " " + chr(92) + chr(10)
                      lines.insert(i + 1, chr(9) + "airoha-en7581-npu-firmware" + chr(10))
                      break
              else:
                  raise SystemExit("Could not extend Nokia MD DEVICE_PACKAGES")
              p.write_text("".join(lines))
          PY
          grep -A5 '^&npu' "$MD_DTS"
          grep -A10 '^define Device/nokia_xg-040g-md-common' target/linux/airoha/image/an7581.mk
          mkdir -p "$GITHUB_WORKSPACE/output"
          printf '%s\n' \
            "Source: https://github.com/coolsnowwolf/lede" \
            "Target: airoha/an7581" \
            "Profile: nokia_xg-040g-md-ubi" \
            "NPU: airoha,en7581-npu + EN7581 firmware (no Wi-Fi-only carveouts)" \
            > "$GITHUB_WORKSPACE/output/source-profile-audit.txt"

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add Airoha NPU LuCI management interface
        working-directory: openwrt
        run: |
          # Upstream dashboard for AN7581/AN7583: NPU status, offload and engine monitoring.
          git clone --depth=1 https://github.com/rchen14b/luci-app-airoha-npu.git package/luci-app-airoha-npu
          test -f package/luci-app-airoha-npu/Makefile

      - name: Configure packages and validate target
        working-directory: openwrt
        run: |
          {
            echo 'CONFIG_PACKAGE_luci=y'
            echo 'CONFIG_PACKAGE_luci-compat=y'
            echo 'CONFIG_PACKAGE_luci-i18n-base-zh-cn=y'
            for pkg in \
              luci-theme-argon luci-app-adguardhome adguardhome \
              luci-app-airoha-npu \
              luci-app-openclash luci-app-passwall2 luci-app-homeproxy \
              luci-app-nlbwmon nlbwmon luci-app-statistics \
              luci-app-ttyd ttyd luci-app-wol luci-app-ddns ddns-scripts \
              luci-app-sqm sqm-scripts htop airoha-en7581-npu-firmware \
              qmodem luci-app-qmodem-next \
              kmod-usb-net kmod-usb-net-cdc-ether kmod-usb-net-cdc-ncm \
              kmod-usb-net-qmi-wwan kmod-usb-net-cdc-mbim kmod-usb-net-rndis \
              kmod-usb-serial kmod-usb-serial-option kmod-usb-serial-wwan \
              usb-modeswitch uqmi umbim comgt comgt-ncm \
              luci-proto-qmi luci-proto-mbim luci-proto-ncm \
              kmod-mac80211 kmod-cfg80211 iw iwinfo \
              kmod-mt7601u kmod-mt76x0u kmod-mt76x2u \
              kmod-ath9k-htc kmod-rtl8xxxu kmod-rtl8187; do
              echo "CONFIG_PACKAGE_${pkg}=y"
            done
          } >> .config
          make defconfig
          # Reassert the requested UBI profile after package normalization and resolve again.
          echo 'CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y' >> .config
          # Do not run defconfig again here: this branch's device choice gets
          # normalized away in defconfig even though the image profile exists.
          # Preserve the requested symbol for the build and validate the seed.
          # Print resolved Airoha/Nokia profile symbols for diagnostics.
          grep -E '^CONFIG_TARGET_(airoha|airoha_an7581|DEVICE_.*nokia.*xg.*040g.*md.*ubi)=' .config || true
          python3 - <<'PY'
          from pathlib import Path
          cfg = Path(".config").read_text().splitlines()
          expected = [
              "CONFIG_TARGET_airoha=y",
              "CONFIG_TARGET_airoha_an7581=y",
              "CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y",
          ]
          missing = [item for item in expected if item not in cfg]
          if missing:
              print("Target config check failed; missing:", *missing, sep="\\n  ")
              print("Resolved Nokia target entries:")
              print("\\n".join(x for x in cfg if "nokia" in x.lower() and "TARGET_DEVICE" in x))
              raise SystemExit(1)
          print("Target config validation passed.")
          PY
          # Require the LuCI NPU app to survive Kconfig normalization.
          if ! grep -qx 'CONFIG_PACKAGE_luci-app-airoha-npu=y' .config; then
            echo "ERROR: luci-app-airoha-npu was dropped by make defconfig; refusing to build firmware without its menu."
            grep -E 'luci-app-airoha-npu|CONFIG_PACKAGE_luci=' .config || true
            exit 1
          fi
          grep -qx 'CONFIG_NET_AIROHA_NPU=y' target/linux/airoha/an7581/config-6.18
          {
            echo "Resolved optional package selection:"
            for pkg in luci-app-airoha-npu luci-theme-argon luci-app-adguardhome luci-app-openclash \
              luci-app-passwall2 luci-app-homeproxy luci-app-nlbwmon \
              luci-app-statistics luci-app-ttyd luci-app-sqm \
              airoha-en7581-npu-firmware qmodem luci-app-qmodem-next; do
              if grep -qx "CONFIG_PACKAGE_${pkg}=y" .config; then
                echo "ENABLED ${pkg}"
              else
                echo "UNAVAILABLE_OR_DEPENDENCY_MISSING ${pkg}"
              fi
            done
          } > "$GITHUB_WORKSPACE/output/package-availability.txt"
          cp .config "$GITHUB_WORKSPACE/output/build.config.resolved"

      - name: Set light-blue Design LuCI theme as default
        working-directory: openwrt
        run: |
          # Keep Argon available as an optional theme, but boot into Design.
          grep -qx 'CONFIG_PACKAGE_luci-theme-design=y' .config
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/97-luci-theme-design <<'EOF'
          #!/bin/sh
          # Select the light Design theme on first boot.
          uci -q set luci.main.mediaurlbase='/luci-static/design'
          uci -q commit luci
          exit 0
          EOF
          chmod 0755 files/etc/uci-defaults/97-luci-theme-design

      - name: Enable hardware flow offloading defaults
        working-directory: openwrt
        run: |
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/98-enable-hw-offload <<'EOF'
          #!/bin/sh
          # Enable OpenWrt firewall flow offloading and hardware offload on AN7581.
          uci -q set firewall.@defaults[0].flow_offloading='1'
          uci -q set firewall.@defaults[0].flow_offloading_hw='1'
          uci -q commit firewall
          exit 0
          EOF
          chmod 0755 files/etc/uci-defaults/98-enable-hw-offload

      - name: Add safe CPU governor default
        working-directory: openwrt
        run: |
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-cpufreq-schedutil <<'EOF'
          #!/bin/sh
          p=/sys/devices/system/cpu/cpufreq/policy0
          [ -w "$p/scaling_governor" ] || exit 0
          avail="$(cat "$p/scaling_available_governors" 2>/dev/null)"
          case " $avail " in
            *" schedutil "*) echo schedutil > "$p/scaling_governor" ;;
            *) logger -t cpufreq-default "schedutil unavailable; keep kernel default" ;;
          esac
          exit 0
          EOF
          chmod 0755 files/etc/uci-defaults/99-cpufreq-schedutil

      - name: Download sources
        working-directory: openwrt
        run: make download -j8

      - name: Patch Quectel QMI WWAN for Linux 6.18 hrtimer API
        working-directory: openwrt
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("package/wwan/driver/quectel_QMI_WWAN/src/qmi_wwan_q.c")
          s = p.read_text()
          old = "\thrtimer_init(&priv->agg_hrtimer, CLOCK_MONOTONIC, HRTIMER_MODE_REL);\n\tpriv->agg_hrtimer.function = rmnet_usb_tx_agg_timer_cb;"
          new = "\thrtimer_setup(&priv->agg_hrtimer, rmnet_usb_tx_agg_timer_cb, HRTIMER_MODE_REL, CLOCK_MONOTONIC);"
          if new in s:
              print("Quectel QMI WWAN hrtimer API patch already applied.")
          elif old in s:
              p.write_text(s.replace(old, new, 1))
              print("Patched legacy hrtimer_init to hrtimer_setup.")
          else:
              raise SystemExit("Expected Quectel hrtimer initialization block not found; stop rather than apply an unsafe patch.")
          PY
          grep -n -A2 -B2 'hrtimer_setup' package/wwan/driver/quectel_QMI_WWAN/src/qmi_wwan_q.c

      - name: Compile firmware
        working-directory: openwrt
        run: make -j2 V=s

      - name: Collect firmware and reports
        if: success()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output"
          find openwrt/bin/targets/airoha/an7581 -maxdepth 1 -type f \
            \( -iname '*nokia_xg-040g-md-ubi*' -o -iname '*nokia_xg-040g-md*manifest' \) \
            -exec cp -v {} "$GITHUB_WORKSPACE/output/" \;
          # Mark the distributed firmware image filenames as NPU-enabled.
          for image in "$GITHUB_WORKSPACE"/output/*.itb; do
            [ -f "$image" ] || continue
            base="${image%.itb}"
            case "$base" in *-NPU) ;; *) mv "$image" "${base}-NPU.itb" ;; esac
          done
          cp openwrt/.config "$GITHUB_WORKSPACE/output/build.config"
          cp openwrt/feeds.conf.default "$GITHUB_WORKSPACE/output/feeds.conf.default"
          test -n "$(find "$GITHUB_WORKSPACE/output" -maxdepth 1 -type f -iname '*nokia_xg-040g-md-ubi*NPU*.itb' -print -quit)"
          ls -lh "$GITHUB_WORKSPACE/output"

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lede-nokia-xg040gmd-ubi-npu-firmware
          path: output/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lede-nokia-xg040gmd-npu-build-diagnostics
          path: |
            openwrt/.config
            openwrt/logs/**
            output/**
          if-no-files-found: ignore
          retention-days: 7
