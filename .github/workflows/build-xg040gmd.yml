name: XG-040G-MD LEDE-compatible OpenWrt build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-xg040gmd.yml"
      - "README.md"

permissions:
  contents: read

env:
  SOURCE_REPO: https://github.com/xiangtailiang/openwrt.git
  SOURCE_BRANCH: xg040gmd-fixes
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout build recipe
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-dev rsync swig unzip zlib1g-dev file \
            wget curl libelf-dev device-tree-compiler

      - name: Fetch XG-040G-MD adapted source
        run: |
          git clone --depth 1 --branch "$SOURCE_BRANCH" "$SOURCE_REPO" openwrt
          cd openwrt
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          grep -nE 'CONFIG_NET_AIROHA(=|_NPU=)' target/linux/airoha/an7581/config-* || true
          grep -nE 'airoha-en7581-npu-firmware|kmod-airoha-(eth|npu)' target/linux/airoha/an7581/target.mk || true

      - name: Pin LuCI feed to compatible stable branch
        working-directory: openwrt
        run: |
          sed -i 's|^src-git luci .*|src-git luci https://git.openwrt.org/project/luci.git;openwrt-24.10|' feeds.conf.default
          grep '^src-git luci ' feeds.conf.default

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure Nokia XG-040G-MD
        working-directory: openwrt
        run: |
          cat > .config <<'EOF_CONFIG'
          CONFIG_TARGET_airoha=y
          CONFIG_TARGET_airoha_an7581=y
          CONFIG_TARGET_airoha_an7581_DEVICE_bell_xg-040g-md=y
          CONFIG_LINUX_6_12=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_kmod-usb-core=y
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb-xhci-hcd=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-usb-storage-uas=y
          CONFIG_PACKAGE_kmod-usb-net=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
          CONFIG_PACKAGE_kmod-usb-serial=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_kmod-usb-serial-wwan=y
          CONFIG_PACKAGE_kmod-usb-serial-qualcomm=y
          CONFIG_PACKAGE_kmod-usb-serial-sierrawireless=y
          CONFIG_PACKAGE_usb-modeswitch=y
          CONFIG_PACKAGE_usbutils=y
          CONFIG_PACKAGE_ethtool=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_luci-app-opkg=y
          EOF_CONFIG
          make defconfig
          grep -E 'CONFIG_TARGET_airoha_an7581_DEVICE_bell_xg-040g-md=y|CONFIG_PACKAGE_(airoha-en7581-npu-firmware|kmod-airoha-eth|kmod-airoha-npu)=y|CONFIG_NET_AIROHA(=m|_NPU=m)' .config | tee build-config-check.txt
          grep -q '^CONFIG_TARGET_airoha_an7581_DEVICE_bell_xg-040g-md=y$' .config
          grep -q '^CONFIG_PACKAGE_airoha-en7581-npu-firmware=y$' .config

      - name: Download sources
        working-directory: openwrt
        run: make download -j8

      - name: Patch legacy LuCI CMake minimum version
        working-directory: openwrt
        run: |
          mapfile -t FILES < <(find build_dir -type f -path "*lucihttp*/CMakeLists.txt" -print)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No extracted lucihttp CMakeLists.txt found under build_dir"
            find build_dir -maxdepth 4 -iname "*lucihttp*" -print | head -n 50
            exit 1
          fi
          for FILE in "${FILES[@]}"; do
            sed -i -E "s/cmake_minimum_required\\(VERSION[[:space:]]+[0-9.]+/cmake_minimum_required(VERSION 3.5/" "$FILE"
            head -n 3 "$FILE"
          done

      - name: Compile firmware
        working-directory: openwrt
        run: |
          make -j"$(nproc)" || make -j1 V=s

      - name: Stamp firmware filenames (Beijing time)
        working-directory: openwrt
        run: |
          STAMP="$(date +'%Y%m%d-%H%M%S')"
          echo "BUILD_STAMP=$STAMP" >> "$GITHUB_ENV"
          echo "Build completed: $(date +'%Y-%m-%d %H:%M:%S %Z')" >> build-config-check.txt
          find bin/targets/airoha/an7581 -type f \( -name '*.bin' -o -name '*.img' -o -name '*.itb' \) -print0 | while IFS= read -r -d '' f; do
            ext="${f##*.}"
            base="${f%.*}"
            mv "$f" "${base}-${STAMP}.${ext}"
          done

      - name: Upload firmware and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XG-040G-MD-LEDE-${{ env.BUILD_STAMP || 'BUILDING' }}
          path: |
            openwrt/bin/targets/airoha/an7581/
            openwrt/build-config-check.txt
          if-no-files-found: warn
